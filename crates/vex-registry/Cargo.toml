[package]
name = "vex-registry"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Package registry client used by the vexlang CLI (login, publish, add)"
repository = "https://github.com/cybercoretech/vexlang"
homepage = "https://github.com/cybercoretech/vexlang"

[dependencies]
anyhow = "1.0.104"
dirs = "7.0.0"
hex = "0.4.3"
reqwest = { version = "0.13.5", features = ["json", "multipart", "blocking"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.0"
toml = "1.1.8"
