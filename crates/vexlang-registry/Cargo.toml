[package]
name = "vexlang-registry"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Package index client for the Vex language: index lookup, verified installs, vex.lock, reproducible packaging"
readme = "README.md"
keywords = ["vex", "package-manager", "lockfile", "registry"]
categories = ["development-tools"]
include = ["/src/**", "/README.md", "/LICENSE"]
repository = "https://github.com/cybercoretech/vexlang"
homepage = "https://github.com/cybercoretech/vexlang"

[dependencies]
anyhow = "1.0.104"
flate2 = "1.1"
hex = "0.4.3"
reqwest = { version = "0.13.5", features = ["blocking"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.0"
tar = "0.4"
